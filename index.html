<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kasse</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9f0f2;--card:#fff;--ink:#123042;--mute:#5d7787;--line:#d3e0e5;--ok:#17855a;--bad:#c9392c;--acc:#0e7c86;
--c0:#0e7c86;--c1:#e0762b;--c2:#6a4fb3;--c3:#2f8f4e;--c4:#c43d6b;--c5:#2c6fbb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1c24;--card:#182a35;--ink:#e8f1f5;--mute:#93aab8;--line:#2a4252;--ok:#3fc08a;--bad:#ff7a6b}}
:root[data-theme="dark"]{--bg:#0f1c24;--card:#182a35;--ink:#e8f1f5;--mute:#93aab8;--line:#2a4252;--ok:#3fc08a;--bad:#ff7a6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden;font-variant-numeric:tabular-nums;user-select:none}
header{display:flex;align-items:center;gap:12px;padding:10px 18px}
header h1{font-size:22px;margin:0;font-weight:800;flex:1}
.tb{border:2px solid var(--line);background:var(--card);color:var(--ink);font:700 16px Figtree,system-ui,sans-serif;padding:10px 18px;border-radius:12px;cursor:pointer}
.tb:active{transform:scale(.97)}
main{flex:1;min-height:0;display:grid;grid-template-columns:1fr minmax(340px,38%);gap:14px;padding:0 18px 16px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));grid-auto-rows:1fr;gap:12px;min-height:0;align-content:start;overflow:hidden}
.p{border:0;border-radius:18px;color:#fff;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;padding:14px;min-height:96px;font-family:inherit;position:relative;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.p:active{transform:translateY(2px);box-shadow:none}
.p b{font-size:20px;line-height:1.15;font-weight:800}
.p span{font-size:20px;font-weight:700;opacity:.92}
.p i{position:absolute;top:8px;right:8px;background:#fff;color:var(--ink);font-style:normal;font-weight:800;min-width:28px;height:28px;border-radius:14px;display:grid;place-items:center;font-size:15px;padding:0 6px}
.empty{grid-column:1/-1;background:var(--card);border:2px dashed var(--line);border-radius:18px;padding:30px;text-align:center;color:var(--mute);font-size:18px}
aside{display:flex;flex-direction:column;gap:10px;min-height:0}
.box{background:var(--card);border-radius:18px;padding:12px 16px}
#tot{text-align:right}
#tot small{display:block;color:var(--mute);font-weight:700;font-size:15px}
#tot strong{font-size:clamp(44px,8vh,76px);font-weight:800;line-height:1}
#lines{flex:1;min-height:0;overflow:auto;padding:6px 10px}
.l{display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid var(--line);font-size:17px;font-weight:600}
.l:last-child{border:0}.l em{font-style:normal;color:var(--mute);width:34px}.l span{flex:1}
.l button{border:0;background:var(--bg);color:var(--ink);width:34px;height:34px;border-radius:10px;font-size:20px;font-weight:800;cursor:pointer}
.hint{color:var(--mute);text-align:center;padding:14px;font-size:16px}
#money{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
#money button{border:0;border-radius:10px;padding:9px 0;font:800 16px Figtree,system-ui,sans-serif;color:#fff;cursor:pointer}
#money button:active{transform:scale(.95)}
.note{background:#2c6fbb}.coin{background:#8a6a1e}
.row{display:flex;justify-content:space-between;align-items:baseline;font-size:18px;font-weight:700}
.row strong{font-size:26px}
#chg{font-size:clamp(30px,5vh,46px)!important}
.go{display:grid;grid-template-columns:1fr 1fr 2fr;gap:8px}.sm{padding:6px 12px;font-size:14px;float:left;border-radius:10px}
.go button{border:0;border-radius:14px;padding:14px;font:800 19px Figtree,system-ui,sans-serif;cursor:pointer}
#clr,#exact{background:var(--bg);color:var(--ink)}
#done{background:var(--ok);color:#fff}
#done:disabled{opacity:.35}
.ov{position:fixed;inset:0;background:rgba(10,25,35,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:9}
.ov.on{display:flex}
.sheet{background:var(--card);border-radius:22px;width:min(760px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.sh{display:flex;align-items:center;padding:16px 20px;gap:10px}.sh h2{margin:0;flex:1;font-size:24px}
.sb{padding:0 20px 20px;overflow:auto}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.kpi{background:var(--bg);border-radius:14px;padding:14px}.kpi small{color:var(--mute);font-weight:700}.kpi strong{display:block;font-size:34px}.kpi input{display:block;width:100%;font:800 30px Figtree,system-ui,sans-serif;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:2px 8px;user-select:text}
table{width:100%;border-collapse:collapse;font-size:18px}
td,th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right}td:first-child,th:first-child{text-align:left}
th{color:var(--mute);font-size:15px}
.bar{height:8px;border-radius:4px;background:var(--acc);margin-top:5px}
.pr{display:grid;grid-template-columns:1fr 120px 46px;gap:8px;margin-bottom:8px}
.pr input,.add input{font:600 18px Figtree,system-ui,sans-serif;padding:11px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-width:0;user-select:text}
.pr button{border:0;border-radius:10px;background:var(--bad);color:#fff;font-size:20px;cursor:pointer}
.add{display:grid;grid-template-columns:1fr 120px auto;gap:8px;margin-top:14px;padding-top:14px;border-top:2px solid var(--line)}
.add button{border:0;border-radius:10px;background:var(--acc);color:#fff;font:800 17px Figtree,system-ui,sans-serif;padding:0 18px;cursor:pointer}
.exp{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}.msg{margin-top:10px;color:var(--bad);font-weight:700}
.danger{margin-top:16px;border:2px solid var(--bad);color:var(--bad);background:none;border-radius:12px;padding:11px 16px;font:700 16px Figtree,system-ui,sans-serif;cursor:pointer}
@media (max-width:760px){main{grid-template-columns:1fr;overflow:auto}body{overflow:auto}}
</style>
</head>
<body>
<header><h1>Kasse</h1><button class="tb" id="bUndo">Rückgängig</button><button class="tb" id="bStat">Statistik</button><button class="tb" id="bProd">Produkte</button></header>
<main>
 <div id="grid"></div>
 <aside>
  <div class="box" id="tot"><button class="tb sm" id="bDisc">Rabatt</button><small>Gesamtpreis</small><strong id="total">0,00 €</strong></div>
  <div class="box" id="lines"></div>
  <div class="box">
   <div id="money"></div>
  </div>
  <div class="box">
   <div class="row"><span>Erhalten</span><strong id="paid">0,00 €</strong></div>
   <div class="row"><span id="chgL">Wechselgeld</span><strong id="chg">0,00 €</strong></div>
  </div>
  <div class="go"><button id="clr">Neu</button><button id="exact">Passend</button><button id="done" disabled>Verkauf abschließen</button></div>
 </aside>
</main>

<div class="ov" id="oStat"><div class="sheet"><div class="sh"><h2>Statistik</h2><button class="tb" data-close>Schließen</button></div><div class="sb" id="statBody"></div></div></div>
<div class="ov" id="oProd"><div class="sheet"><div class="sh"><h2>Produkte</h2><button class="tb" data-close>Fertig</button></div><div class="sb"><div id="prList"></div>
 <div class="add"><input id="nName" placeholder="Name, z. B. Kuchen"><input id="nPrice" placeholder="Preis (Pfand: −1)"><button id="nAdd">Hinzufügen</button></div></div></div></div>

<div class="ov" id="oDisc"><div class="sheet" style="width:min(460px,100%)"><div class="sh"><h2>Rabatt</h2><button class="tb" data-close>Schließen</button></div><div class="sb"><div class="exp"><button class="tb" data-dp="10">10 %</button><button class="tb" data-dp="20">20 %</button><button class="tb" data-dp="50">50 %</button></div><div class="add" style="grid-template-columns:1fr auto"><input id="de" inputmode="decimal" placeholder="Betrag in €"><button id="dAdd">Abziehen</button></div></div></div></div>
<div class="ov" id="oPin"><div class="sheet" style="width:min(420px,100%)"><div class="sh"><h2 id="pt">PIN eingeben</h2></div><div class="sb"><input id="pi" type="password" inputmode="numeric" maxlength="8" style="width:100%;font:800 28px Figtree,system-ui,sans-serif;padding:10px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);user-select:text;text-align:center"><div class="msg" id="pe"></div><div class="exp"><button class="tb" data-close>Abbrechen</button><button class="tb" id="pok" style="background:var(--acc);color:#fff;border-color:var(--acc)">OK</button></div></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const COL=['--c0','--c1','--c2','--c3','--c4','--c5'];
const BILLS=[[50,'50 €','note'],[20,'20 €','note'],[10,'10 €','note'],[5,'5 €','note'],[2,'2 €','coin'],[1,'1 €','coin'],[.5,'50 ct','coin'],[.2,'20 ct','coin'],[.1,'10 ct','coin'],[.05,'5 ct','coin']];
let disc=null,pin='',gateFn=null,pinMode='',undoArm=0,startC=5000,products=[],stats={sum:0,n:0,items:{}},order={},paid=0,resetArmed=false;
const $=id=>document.getElementById(id);
const eur=c=>(c/100).toLocaleString('de-DE',{style:'currency',currency:'EUR'});
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function load(){try{const a=localStorage.getItem('kasse-p'),b=localStorage.getItem('kasse-s'),f=localStorage.getItem('kasse-f');if(f!==null&&!isNaN(+f))startC=+f;pin=localStorage.getItem('kasse-pin')||'';if(a)products=JSON.parse(a);else products=[{id:1,name:'Kaffee',price:200},{id:2,name:'Kuchen',price:250},{id:3,name:'Waffel',price:300},{id:4,name:'Wasser',price:100}];if(b)stats=JSON.parse(b)}catch(e){products=[{id:1,name:'Kaffee',price:200},{id:2,name:'Kuchen',price:250}]}}
function save(){try{localStorage.setItem('kasse-p',JSON.stringify(products));localStorage.setItem('kasse-s',JSON.stringify(stats));localStorage.setItem('kasse-f',String(startC));localStorage.setItem('kasse-pin',pin)}catch(e){}}
const gross=()=>products.reduce((s,p)=>s+(order[p.id]||0)*p.price,0);
const dsc=()=>{const g=gross();return !disc||g<=0?0:Math.min(g,disc.t==='pct'?Math.round(g*disc.v/100):disc.v)};
const total=()=>gross()-dsc();
function render(){
 $('grid').innerHTML=products.length?products.map((p,i)=>`<button class="p" style="background:var(${COL[i%6]})" data-add="${p.id}">${order[p.id]?`<i>${order[p.id]}</i>`:''}<b>${esc(p.name)}</b><span>${eur(p.price)}</span></button>`).join(''):'<div class="empty">Noch keine Produkte.<br>Tippe oben auf „Produkte“, um welche anzulegen.</div>';
 const t=total();$('total').textContent=eur(t);
 const ls=products.filter(p=>order[p.id]);
 $('lines').innerHTML=(ls.length?ls.map(p=>`<div class="l"><em>${order[p.id]}×</em><span>${esc(p.name)}</span><b>${eur(order[p.id]*p.price)}</b><button data-sub="${p.id}">−</button></div>`).join(''):'<div class="hint">Tippe links auf ein Produkt</div>')+(dsc()?`<div class="l"><em></em><span>Rabatt</span><b>−${eur(dsc())}</b><button data-nod>✕</button></div>`:'');
 $('money').innerHTML=BILLS.map(([v,l,c])=>`<button class="${c}" data-pay="${v}">${l}</button>`).join('');
 const pc=Math.round(paid*100);$('paid').textContent=eur(pc);
 const diff=pc-t;
 if(t<0){$('chgL').textContent='Auszahlen';$('chg').textContent=eur(-t);$('chg').style.color='var(--bad)';$('done').disabled=false}
 else{$('chgL').textContent=diff<0&&t>0?'Es fehlen noch':'Wechselgeld';
 $('chg').textContent=eur(Math.abs(t>0?diff:0));
 $('chg').style.color=t>0?(diff<0?'var(--bad)':'var(--ok)'):'';
 $('done').disabled=!(t>0&&diff>=0)}
}
document.addEventListener('click',e=>{
 const a=e.target.closest('[data-add]'),s=e.target.closest('[data-sub]'),p=e.target.closest('[data-pay]');
 if(a){order[a.dataset.add]=(order[a.dataset.add]||0)+1;render()}
 else if(s){const k=s.dataset.sub;order[k]--;if(order[k]<=0)delete order[k];render()}
 else if(p){paid=Math.round((paid+parseFloat(p.dataset.pay))*100)/100;render()}
 else if(e.target.hasAttribute('data-close'))e.target.closest('.ov').classList.remove('on');
 else if(e.target.hasAttribute('data-nod')){disc=null;render()}
 else if(e.target.dataset.dp){disc={t:'pct',v:+e.target.dataset.dp};$('oDisc').classList.remove('on');render()}
});
$('clr').onclick=()=>{order={};paid=0;disc=null;render()};
$('exact').onclick=()=>{const t=total();if(t>0){paid=t/100;render()}};
$('bDisc').onclick=()=>$('oDisc').classList.add('on');
$('dAdd').onclick=()=>{const v=parseFloat($('de').value.replace(',','.'));if(!(v>0))return;disc={t:'eur',v:Math.round(v*100)};$('de').value='';$('oDisc').classList.remove('on');render()};
$('done').onclick=()=>{
 const t=total(),d=dsc(),en=[];
 stats.sum+=t;stats.n++;stats.disc+=d;
 products.forEach(p=>{const q=order[p.id];if(q){const it=stats.items[p.id]||(stats.items[p.id]={name:p.name,qty:0,rev:0});it.name=p.name;it.qty+=q;it.rev+=q*p.price;en.push([p.id,q,q*p.price])}});
 stats.log.push({t,d,en});if(stats.log.length>30)stats.log.shift();
 save();order={};paid=0;disc=null;render();
};
$('bUndo').onclick=()=>{const l=stats.log[stats.log.length-1],b=$('bUndo');
 if(!l){b.textContent='Nichts zu löschen';setTimeout(()=>b.textContent='Rückgängig',1500);return}
 if(!undoArm){b.textContent='Letzten Verkauf ('+eur(l.t)+') löschen?';undoArm=setTimeout(()=>{undoArm=0;b.textContent='Rückgängig'},3500);return}
 clearTimeout(undoArm);undoArm=0;
 stats.log.pop();stats.sum-=l.t;stats.n--;stats.disc-=l.d;
 l.en.forEach(([id,q,r])=>{const it=stats.items[id];if(it){it.qty-=q;it.rev-=r;if(it.qty<=0)delete stats.items[id]}});
 save();b.textContent='Rückgängig';render()};
$('bStat').onclick=()=>gate(()=>{resetArmed=false;showStats();$('oStat').classList.add('on')});
function showStats(){
 const rows=Object.values(stats.items).sort((a,b)=>b.qty-a.qty),max=rows.length?rows[0].qty:1;
 $('statBody').innerHTML=`<div class="kpis"><div class="kpi"><small>Einnahmen (ohne Startgeld)</small><strong>${eur(stats.sum)}</strong></div><div class="kpi"><small>Verkäufe</small><strong>${stats.n}</strong></div><div class="kpi"><small>Startgeld (Wechselgeld) in €</small><input id="fl" inputmode="decimal" value="${(startC/100).toFixed(2).replace('.',',')}"></div><div class="kpi"><small>Geld in der Kasse jetzt</small><strong>${eur(startC+stats.sum)}</strong></div></div><div class="kpi" style="margin-bottom:14px"><small>Kassensturz: gezähltes Geld in der Kasse (€)</small><div style="display:flex;gap:12px;align-items:center"><input id="ct" inputmode="decimal" placeholder="z. B. 123,45" style="flex:1"><strong id="cd" style="font-size:24px"></strong></div></div>`+
 (rows.length?`<table><tr><th>Produkt</th><th>Anzahl</th><th>Umsatz</th></tr>${rows.map(r=>`<tr><td>${esc(r.name)}<div class="bar" style="width:${Math.max(4,Math.abs(r.qty)/max*100)}%"></div></td><td><b>${r.qty}×</b></td><td>${eur(r.rev)}</td></tr>`).join('')}${stats.disc?`<tr><td>Rabatte</td><td></td><td>−${eur(stats.disc)}</td></tr>`:''}</table>`:'<div class="hint">Noch nichts verkauft.</div>')+
 (DL?`<div class="exp"><button class="tb" id="xX">Excel herunterladen</button><button class="tb" id="xP">PDF herunterladen</button><button class="tb" id="bk">Sicherung speichern</button></div>`:'')+
 `<div class="exp"><button class="tb" id="rs">Sicherung laden</button><button class="tb" id="pn">${pin?'PIN ändern / entfernen':'PIN festlegen'}</button></div><input type="file" id="fi" accept=".json,application/json" hidden><div class="msg" id="expMsg"></div><button class="danger" id="rst">${resetArmed?'Wirklich alles löschen? Nochmal tippen':'Statistik zurücksetzen'}</button>`;
 $('fl').onchange=e=>{const v=parseFloat(e.target.value.replace(',','.'));if(!isNaN(v)&&v>=0){startC=Math.round(v*100);save()}showStats()};
 $('ct').oninput=e=>{const v=parseFloat(e.target.value.replace(',','.')),c=$('cd');if(isNaN(v)){c.textContent='';return}const df=Math.round(v*100)-(startC+stats.sum);c.textContent=df===0?'✓ Stimmt':(df>0?'+':'−')+eur(Math.abs(df))+(df>0?' zu viel':' fehlen');c.style.color=df===0?'var(--ok)':'var(--bad)'};
 $('rs').onclick=()=>$('fi').click();$('fi').onchange=restore;$('pn').onclick=()=>openPin('set',showStats);
 if(DL){$('bk').onclick=backup;$('xX').onclick=()=>exportFile('xlsx');$('xP').onclick=()=>exportFile('pdf')}
 $('rst').onclick=()=>{if(!resetArmed){resetArmed=true;showStats();return}stats={sum:0,n:0,items:{},log:[],disc:0};save();resetArmed=false;showStats()};
}
let DL=null;
try{if(window.claude&&claude.use)claude.use('downloads').then(x=>{DL=x}).catch(()=>{})}catch(e){}
async function exportFile(kind){
 const m=$('expMsg');m.textContent='';
 const rows=Object.values(stats.items).sort((a,b)=>b.qty-a.qty);
 const d=new Date(),ds=d.toISOString().slice(0,10),dl=d.toLocaleDateString('de-DE');
 const qty=rows.reduce((q,r)=>q+r.qty,0);
 try{
  let data,name;
  if(kind==='xlsx'){
   if(!window.XLSX)throw{code:'lib'};
   const aoa=[['Kassen-Statistik',dl],[],['Einnahmen ohne Startgeld (€)',stats.sum/100],['Verkäufe',stats.n],['Startgeld (€)',startC/100],['Kassenbestand (€)',(startC+stats.sum)/100],[],['Produkt','Anzahl','Umsatz (€)']].concat(rows.map(r=>[r.name,r.qty,r.rev/100]),stats.disc?[['Rabatte',null,-stats.disc/100]]:[],[['Summe',qty,stats.sum/100]]);
   const ws=XLSX.utils.aoa_to_sheet(aoa);
   Object.keys(ws).forEach(a=>{if(a[0]!=='!'&&typeof ws[a].v==='number'&&(a[0]==='C'||['B3','B5','B6'].includes(a)))ws[a].z='#,##0.00'});
   ws['!cols']=[{wch:30},{wch:12},{wch:16}];
   const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Statistik');
   data=new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})]);name='Kassen-Statistik '+ds+'.xlsx';
  }else{
   if(!window.jspdf)throw{code:'lib'};
   const pdf=new jspdf.jsPDF(),E=c=>(c/100).toFixed(2).replace('.',',')+' EUR';
   pdf.setFontSize(22);pdf.text('Kassen-Statistik',20,24);
   pdf.setFontSize(11);pdf.text(dl,190,24,{align:'right'});
   pdf.setFontSize(14);pdf.text('Einnahmen (ohne Startgeld): '+E(stats.sum),20,40);pdf.text('Verkäufe: '+stats.n,20,48);pdf.text('Startgeld: '+E(startC),20,56);pdf.text('Kassenbestand: '+E(startC+stats.sum),20,64);
   let y=82;
   const head=()=>{pdf.setFontSize(12);pdf.setFont(undefined,'bold');pdf.text('Produkt',20,y);pdf.text('Anzahl',130,y,{align:'right'});pdf.text('Umsatz',190,y,{align:'right'});pdf.line(20,y+2,190,y+2);pdf.setFont(undefined,'normal');y+=10};
   head();
   rows.concat(stats.disc?[{name:'Rabatte',qty:'',rev:-stats.disc}]:[],[{name:'Summe',qty:qty,rev:stats.sum}]).forEach((r,i,a)=>{
    if(y>280){pdf.addPage();y=24;head()}
    if(i===a.length-1){pdf.setFont(undefined,'bold');pdf.line(20,y-6,190,y-6)}
    pdf.text(String(r.name),20,y);pdf.text(String(r.qty),130,y,{align:'right'});pdf.text(E(r.rev),190,y,{align:'right'});y+=9;
   });
   data=new Blob([pdf.output('arraybuffer')]);name='Kassen-Statistik '+ds+'.pdf';
  }
  await DL.save({filename:name,data});
 }catch(e){
  if(e&&e.code==='declined')return;
  m.textContent=e&&e.code==='lib'?'Export nicht möglich: Zusatzbibliothek konnte nicht geladen werden (Internet prüfen).':'Export hat nicht geklappt. Bitte nochmal versuchen.';
 }
}
function say(t,ok){const m=$('expMsg');if(m){m.textContent=t;m.style.color=ok?'var(--ok)':'var(--bad)'}}
function backup(){DL.save({filename:'Kasse-Sicherung '+new Date().toISOString().slice(0,10)+'.json',data:JSON.stringify({v:1,products,stats,startC,pin})}).catch(e=>{if(!e||e.code!=='declined')say('Sicherung hat nicht geklappt.')})}
function restore(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.products)||!d.stats)throw 0;products=d.products;stats=d.stats;startC=+d.startC||0;pin=d.pin||'';norm();save();order={};paid=0;disc=null;render();showStats();say('Sicherung geladen.',1)}catch(x){say('Diese Datei ist keine gültige Sicherung.')}};
 r.readAsText(f)}
function gate(fn){if(!pin){fn();return}openPin('unlock',fn)}
function openPin(m,fn){pinMode=m;gateFn=fn;$('pt').textContent=m==='set'?'Neue PIN (4–8 Ziffern), leer = ohne PIN':'PIN eingeben';$('pi').value='';$('pe').textContent='';$('oPin').classList.add('on');setTimeout(()=>$('pi').focus(),60)}
$('pok').onclick=()=>{const v=$('pi').value.trim();
 if(pinMode==='unlock'){if(v!==pin){$('pe').textContent='Falsche PIN';$('pi').value='';return}}
 else if(v&&!/^\d{4,8}$/.test(v)){$('pe').textContent='Bitte 4 bis 8 Ziffern eingeben.';return}
 else{pin=v;save()}
 $('oPin').classList.remove('on');gateFn&&gateFn()};
$('pi').onkeydown=e=>{if(e.key==='Enter')$('pok').click()};
$('bProd').onclick=()=>gate(()=>{showProds();$('oProd').classList.add('on')});
function showProds(){
 $('prList').innerHTML=products.length?products.map(p=>`<div class="pr"><input value="${esc(p.name)}" data-n="${p.id}"><input value="${(p.price/100).toFixed(2).replace('.',',')}" data-pr="${p.id}"><button data-del="${p.id}">✕</button></div>`).join(''):'<div class="hint">Noch keine Produkte angelegt.</div>';
}
$('prList').addEventListener('change',e=>{
 const n=e.target.dataset.n,r=e.target.dataset.pr;
 if(n){const p=products.find(x=>x.id==n);if(e.target.value.trim())p.name=e.target.value.trim()}
 if(r){const p=products.find(x=>x.id==r),v=parseFloat(e.target.value.replace(',','.').replace('−','-'));if(!isNaN(v))p.price=Math.round(v*100);e.target.value=(p.price/100).toFixed(2).replace('.',',')}
 save();render();
});
$('prList').addEventListener('click',e=>{const d=e.target.closest('[data-del]');if(d){const id=+d.dataset.del;products=products.filter(p=>p.id!==id);delete order[id];save();showProds();render()}});
$('nAdd').onclick=()=>{
 const n=$('nName').value.trim(),v=parseFloat($('nPrice').value.replace(',','.').replace('−','-'));
 if(!n||isNaN(v)){$('nPrice').style.borderColor='var(--bad)';return}
 $('nPrice').style.borderColor='';
 products.push({id:Date.now(),name:n,price:Math.round(v*100)});
 $('nName').value='';$('nPrice').value='';save();showProds();render();$('nName').focus();
};
function norm(){stats.log=stats.log||[];stats.disc=stats.disc||0;stats.items=stats.items||{}}
load();norm();render();
</script>
</body>
</html>
